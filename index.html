<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Little RPG Archive</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap');

  :root {
    --bg:        #1b1712;
    --bg2:       #25201a;
    --paper:     #ede4d3;
    --paper-dim: #a89a83;
    --brass:     #c9a24a;
    --border:    #3c3327;
    --shadow:    rgba(0,0,0,0.45);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--paper);
    font-family: 'Crimson Text', Georgia, serif;
    min-height: 100%;
  }

  body {
    background-image:
      radial-gradient(circle at 15% 10%, rgba(201,162,74,0.06), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(201,162,74,0.05), transparent 40%);
  }

  /* ── HEADER ── */
  header {
    max-width: 760px;
    margin: 0 auto;
    padding: 64px 24px 32px;
    text-align: center;
  }

  .drawer-label {
    display: inline-block;
    font-family: 'Special Elite', monospace;
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--paper-dim);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 5px 14px;
    margin-bottom: 22px;
    position: relative;
  }
  .drawer-label::before, .drawer-label::after {
    content: "•";
    color: var(--brass);
    margin: 0 8px;
  }

  h1 {
    font-family: 'Special Elite', monospace;
    font-size: clamp(28px, 6vw, 46px);
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--paper);
    line-height: 1.35;
  }
  h1 .cursor {
    display: inline-block;
    width: 0.5em;
    background: var(--brass);
    animation: blink 1.1s step-end infinite;
    margin-left: 2px;
    height: 0.9em;
    vertical-align: -0.1em;
  }
  @keyframes blink { 50% { opacity: 0; } }

  header p.tagline {
    margin-top: 18px;
    font-size: 18px;
    font-style: italic;
    color: var(--paper-dim);
    line-height: 1.7;
  }

  header .filed {
    margin-top: 14px;
    font-family: 'Special Elite', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--brass);
    text-transform: uppercase;
  }

  /* ── CATALOG GRID ── */
  main {
    max-width: 920px;
    margin: 0 auto;
    padding: 24px 24px 80px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 28px;
  }

  /* ── CARD (index-card / case-file styling) ── */
  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 3px;
    box-shadow: 0 6px 18px var(--shadow);
    position: relative;
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: var(--paper);
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    overflow: hidden;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 28px var(--shadow);
    border-color: var(--card-accent, var(--brass));
  }
  .card:focus-visible {
    outline: 2px solid var(--card-accent, var(--brass));
    outline-offset: 3px;
  }

  /* coloured "tab" along the top, like a folder tab */
  .card .tab {
    height: 6px;
    width: 100%;
    background: var(--card-accent, var(--brass));
  }

  .card .card-body {
    padding: 22px 24px 20px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .card .seal {
    font-size: 30px;
    margin-bottom: 10px;
    filter: drop-shadow(0 2px 4px var(--shadow));
  }

  .card h2 {
    font-family: 'Special Elite', monospace;
    font-size: 18px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 6px;
    color: var(--paper);
  }

  .card .file-no {
    font-family: 'Special Elite', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--paper-dim);
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .card .file-no .dot { color: var(--card-accent, var(--brass)); }

  .card p.desc {
    font-size: 15px;
    line-height: 1.65;
    color: var(--paper);
    flex: 1;
  }

  .card .meta {
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px dashed var(--border);
    font-size: 12px;
    color: var(--paper-dim);
    font-style: italic;
  }

  .card .play-row {
    margin-top: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: 'Special Elite', monospace;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--card-accent, var(--brass));
  }
  .card .play-row .arrow {
    transition: transform 0.18s ease;
  }
  .card:hover .play-row .arrow {
    transform: translateX(4px);
  }

  /* ── PLACEHOLDER CARD (more to come) ── */
  .card.placeholder {
    border-style: dashed;
    align-items: center;
    justify-content: center;
    text-align: center;
    cursor: default;
  }
  .card.placeholder:hover {
    transform: none;
    box-shadow: 0 6px 18px var(--shadow);
    border-color: var(--border);
  }
  .card.placeholder .card-body {
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--paper-dim);
  }
  .card.placeholder .seal { font-size: 22px; opacity: 0.5; }
  .card.placeholder h2 { color: var(--paper-dim); font-size: 14px; }
  .card.placeholder p.desc { font-style: italic; font-size: 13px; }

  /* ── FOOTER ── */
  footer {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 24px 60px;
    text-align: center;
    font-size: 12px;
    color: var(--paper-dim);
    font-family: 'Special Elite', monospace;
    letter-spacing: 1.5px;
  }
</style>
</head>
<body>

<header>
  <div class="drawer-label">Field Archive — Drawer 1</div>
  <h1>The Little RPG Archive<span class="cursor"></span></h1>
  <p class="tagline">A small, growing collection of browser-based text adventures &mdash;
  bureaucratic comedies, minor catastrophes, and the people sent to sort them out.</p>
  <div class="filed">Open a case file to begin</div>
</header>

<main id="catalog">
  <!-- Cards are rendered by script below -->
</main>

<footer>
  Filed &amp; maintained, occasionally, by the proprietor of this archive.
</footer>

<script>
  // ════════════════════════════════════════════════════════
  //  GAME CATALOG
  //  To add a new game: add an entry below. That's it.
  // ════════════════════════════════════════════════════════
  var GAMES = [
    {
      seal: "📜",
      title: "A Matter of Some Urgency",
      fileNo: "Case 01",
      accent: "#d8a648",
      desc: "A small comedy of errors in the grand tradition of overly-confident postal services. One Deliverer, one letter, and a village that is determined to make this take much longer than it needs to.",
      meta: "Comedy · Fighting Fantasy dice combat · ~20\u201330 min",
      href: "matter-of-some-urgency/"
    },
    {
      seal: "🔮",
      title: "The Very Last Witch Finder",
      fileNo: "Case 02",
      accent: "#ad7fe6",
      desc: "The Crown's last remaining Witch Finder is sent to investigate three reported anomalies in the village of Drubwich. Choose your investigator: brute force, or theory. The truth is mostly paperwork.",
      meta: "Comedy · 2 playable characters · ~30\u201350 min",
      href: "witch-finder/"
    },
    {
      seal: "＋",
      title: "More Cases Pending",
      fileNo: "",
      accent: "#6b6151",
      desc: "Further case files are being processed and will be added to this drawer in due course. The backlog is, regrettably, considerable.",
      meta: "",
      href: null
    }
  ];

  var catalog = document.getElementById("catalog");

  GAMES.forEach(function(game, i) {
    var isPlaceholder = !game.href;
    var el = document.createElement(isPlaceholder ? "div" : "a");
    el.className = "card" + (isPlaceholder ? " placeholder" : "");
    if (!isPlaceholder) {
      el.href = game.href;
    }
    el.style.setProperty("--card-accent", game.accent);

    var fileNoHtml = "";
    if (game.fileNo) {
      fileNoHtml = '<div class="file-no">' + game.fileNo + ' <span class="dot">&middot;</span> Active</div>';
    }

    var playRowHtml = "";
    if (!isPlaceholder) {
      playRowHtml = '<div class="play-row"><span>Open File</span><span class="arrow">&rarr;</span></div>';
    }

    var metaHtml = game.meta ? '<div class="meta">' + game.meta + '</div>' : "";

    el.innerHTML =
      '<div class="tab"></div>' +
      '<div class="card-body">' +
        '<div class="seal">' + game.seal + '</div>' +
        fileNoHtml +
        '<h2>' + game.title + '</h2>' +
        '<p class="desc">' + game.desc + '</p>' +
        metaHtml +
        playRowHtml +
      '</div>';

    catalog.appendChild(el);
  });
</script>
</body>
</html>
